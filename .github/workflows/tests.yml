name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pyflakes
      - run: python -m pyflakes src tests
      - run: python -m unittest discover -s tests -v
      - run: publish contract --json
      - name: doctor (no uploader implemented, no ffmpeg-skill here -> degraded, exit 0)
        shell: bash
        run: publish doctor --json --ffmpeg-skill "$RUNNER_TEMP/none" | tee doctor.json
      - name: doctor reports youtube as not implemented and not ready
        run: python -c "import json; d=json.load(open('doctor.json')); y=d['checks']['platforms']['youtube']; assert d['status']=='degraded' and not y['implemented'] and not y['ready'], d"
      - name: upload without --confirm is a dry run
        shell: bash
        run: |
          publish upload README.md --platform youtube --json | tee dry.json
          python -c "import json; d=json.load(open('dry.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
      - name: plan gives a structured FAIL on an over-long title, offline (no ffmpeg-skill here -> its rows UNCHECKED)
        shell: bash
        run: |
          set +e
          publish plan README.md --platform youtube --title "$(printf 'x%.0s' $(seq 101))" --ffmpeg-skill "$RUNNER_TEMP/none" --json > plan.json
          rc=$?
          set -e
          test "$rc" = 1
          python -c "import json; d=json.load(open('plan.json')); t=[r for r in d['checks'] if r['check']=='title length'][0]; assert d['verdict']=='FAIL' and t['status']=='FAIL' and not d['network_used'] and not d['uploaded'], d"

  conformance:
    # Read-only checkout of AI-video-production-OS: the registry conformance checks and the capability contract JSON
    # Schema (roadmap step 1, "Done when: contract validates against the OS schema"). Read-only checkout of ffmpeg-skill
    # and FFmpeg: `publish plan` against the real `check` (roadmap step 2, "structured FAIL on an over-long title or
    # wrong aspect, no network"). Nothing may skip here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/AI-video-production-OS
          path: vendor/AI-video-production-OS
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          path: vendor/ffmpeg-skill
      - name: FFmpeg (ffmpeg-skill's check runs ffprobe)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . jsonschema
      - name: All tests run, none skipped
        env:
          AI_VIDEO_PRODUCTION_OS_DIR: ${{ github.workspace }}/vendor/AI-video-production-OS
          PUBLISH_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ! grep -E "\.\.\. skipped" test.log
