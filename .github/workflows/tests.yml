name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ADR-003: the OS keychain extra (keyring) on 3.12; 3.9 runs without it, the env-only fallback.
        include:
          - python: "3.9"
            extra: ""
          - python: "3.12"
            extra: keychain
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH_EXPECT_KEYRING: ${{ matrix.extra == 'keychain' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (with the keychain extra on 3.12)
        shell: bash
        run: |
          if [ "${{ matrix.extra }}" = keychain ]; then python -m pip install -e ".[keychain]" pyflakes; else python -m pip install -e . pyflakes; fi
      - run: python -m pyflakes src tests
      - name: unit tests; the fake keychain is what runs (ADR-003); uploads reach only the loopback mocks (ADR-004 .. ADR-010)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          grep -E "^test_the_fake_keychain_is_what_runs .* \.\.\. ok" test.log
          grep -E "^test_the_guard_allows_only_the_mock_this_test_started .* \.\.\. ok" test.log
          grep -E "^test_resume_after_an_interrupted_chunk .* \.\.\. ok" test.log
          grep -E "^test_quota_exceeded_is_typed_and_not_retried .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_vimeo .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_tiktok .* \.\.\. ok" test.log
          grep -E "^test_vimeo_resume_after_an_interrupted_chunk .* \.\.\. ok" test.log
          grep -E "^test_vimeo_quota_is_typed_and_not_retried .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_tiktok .* \.\.\. ok" test.log
          grep -E "^test_tiktok_resume_after_an_interrupted_chunk .* \.\.\. ok" test.log
          grep -E "^test_tiktok_daily_post_cap_is_typed_and_not_retried .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_x .* \.\.\. ok" test.log
          grep -E "^test_x_resume_after_an_interrupted_segment .* \.\.\. ok" test.log
          grep -E "^test_x_post_is_never_sent_twice .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_linkedin .* \.\.\. ok" test.log
          grep -E "^test_linkedin_resume_after_an_interrupted_part .* \.\.\. ok" test.log
          grep -E "^test_linkedin_post_is_never_sent_twice .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_facebook .* \.\.\. ok" test.log
          grep -E "^test_facebook_resume_after_an_interrupted_upload .* \.\.\. ok" test.log
          grep -E "^test_facebook_video_is_never_published_twice .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_reels .* \.\.\. ok" test.log
          grep -E "^test_reels_retry_after_an_interrupted_upload .* \.\.\. ok" test.log
          grep -E "^test_reels_post_is_never_published_twice .* \.\.\. ok" test.log
      - run: publish contract --json
      - name: doctor (no credentials, no ffmpeg-skill here -> degraded, exit 0)
        shell: bash
        env:
          # with the extra installed, the command-line steps never read the runner's real keychain
          PUBLISH_KEYCHAIN: ${{ matrix.extra == 'keychain' && 'off' || '' }}
        run: publish doctor --json --ffmpeg-skill "$RUNNER_TEMP/none" | tee doctor.json
      - name: doctor reports youtube, vimeo, tiktok, x, linkedin, facebook and reels as implemented and, without credentials, not ready
        run: python -c "import json; d=json.load(open('doctor.json')); p=d['checks']['platforms']; assert d['status']=='degraded' and all(p[k]['implemented'] and not p[k]['ready'] for k in ('youtube', 'vimeo', 'tiktok', 'x', 'linkedin', 'facebook', 'reels')), d"
      - name: doctor reports the keychain fallback (env only; without the extra, because keyring is not installed)
        shell: bash
        run: |
          python -c "import json, os; d=json.load(open('doctor.json')); k=d['checks']['keychain']; extra=os.environ['PUBLISH_EXPECT_KEYRING']=='1'; assert k['status']=='UNAVAILABLE' and k['fallback'], k; assert ('PUBLISH_KEYCHAIN' in k['reason']) if extra else ('not installed' in k['reason'] and k['install']), k; assert any('environment only' in w for w in d['warnings']), d['warnings']"
      - name: upload without --confirm is a dry run
        shell: bash
        env:
          PUBLISH_KEYCHAIN: ${{ matrix.extra == 'keychain' && 'off' || '' }}
        run: |
          publish upload README.md --platform youtube --json | tee dry.json
          python -c "import json; d=json.load(open('dry.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          publish upload README.md --platform vimeo --json | tee dry-vimeo.json
          python -c "import json; d=json.load(open('dry-vimeo.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          cp README.md short.mp4
          publish upload short.mp4 --platform tiktok --json | tee dry-tiktok.json
          python -c "import json; d=json.load(open('dry-tiktok.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          publish upload short.mp4 --platform x --privacy public --json | tee dry-x.json
          python -c "import json; d=json.load(open('dry-x.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          publish upload short.mp4 --platform linkedin --privacy public --json | tee dry-linkedin.json
          python -c "import json; d=json.load(open('dry-linkedin.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          publish upload short.mp4 --platform facebook --privacy public --json | tee dry-facebook.json
          python -c "import json; d=json.load(open('dry-facebook.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
          publish upload short.mp4 --platform reels --privacy public --json | tee dry-reels.json
          python -c "import json; d=json.load(open('dry-reels.json')); assert d['dry_run'] and not d['uploaded'] and not d['network_used'], d"
      - name: plan gives a structured FAIL on an over-long title, offline (no ffmpeg-skill here -> its rows UNCHECKED)
        shell: bash
        run: |
          set +e
          publish plan README.md --platform youtube --title "$(printf 'x%.0s' $(seq 101))" --ffmpeg-skill "$RUNNER_TEMP/none" --json > plan.json
          rc=$?
          set -e
          test "$rc" = 1
          python -c "import json; d=json.load(open('plan.json')); t=[r for r in d['checks'] if r['check']=='title length'][0]; assert d['verdict']=='FAIL' and t['status']=='FAIL' and not d['network_used'] and not d['uploaded'], d"

  conformance:
    # Read-only checkout of AI-video-production-OS: the registry conformance checks and the capability contract JSON
    # Schema (roadmap step 1, "Done when: contract validates against the OS schema"). Read-only checkout of ffmpeg-skill
    # and FFmpeg: `publish plan` against the real `check` (roadmap step 2, "structured FAIL on an over-long title or
    # wrong aspect, no network"). Nothing may skip here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/AI-video-production-OS
          path: vendor/AI-video-production-OS
      - uses: actions/checkout@v4
        with:
          repository: kajisho5/ffmpeg-skill
          path: vendor/ffmpeg-skill
      - name: FFmpeg (ffmpeg-skill's check runs ffprobe)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[keychain]" jsonschema
      - name: All tests run, none skipped, the fake keychain is what runs (ADR-003), uploads reach only the loopback mocks (ADR-004 .. ADR-010)
        env:
          AI_VIDEO_PRODUCTION_OS_DIR: ${{ github.workspace }}/vendor/AI-video-production-OS
          PUBLISH_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
          PUBLISH_EXPECT_KEYRING: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          ! grep -E "\.\.\. skipped" test.log
          grep -E "^test_the_fake_keychain_is_what_runs .* \.\.\. ok" test.log
          grep -E "^test_the_guard_allows_only_the_mock_this_test_started .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_vimeo .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_x .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_linkedin .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_facebook .* \.\.\. ok" test.log
          grep -E "^test_the_guard_blocks_every_non_loopback_host_for_reels .* \.\.\. ok" test.log
